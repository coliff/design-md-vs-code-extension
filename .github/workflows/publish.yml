name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to VS Code Marketplace and Open VSX
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted Publishing: both registries exchange the GitHub OIDC token for a short-lived
      # publish token, so no VSCE_PAT or OVSX_PAT secret is needed.
      id-token: write

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in a release workflow, to avoid cache poisoning.
          package-manager-cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npx vsce package --out extension.vsix

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --oidc --packagePath extension.vsix --skip-duplicate

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.4.0 publish extension.vsix --trusted-publishing --skip-duplicate
